name: 株式ポートフォリオ自動更新

on:
  schedule:
    # 毎営業日 18:00 JST = 09:00 UTC（月〜金）
    - cron: '0 9 * * 1-5'
  workflow_dispatch:  # 手動実行も可能

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存ライブラリインストール
        run: pip install requests

      - name: ポートフォリオ更新
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          JQUANTS_REFRESH_TOKEN: ${{ secrets.JQUANTS_REFRESH_TOKEN }}
          JQUANTS_EMAIL: ${{ secrets.JQUANTS_EMAIL }}
          JQUANTS_PASSWORD: ${{ secrets.JQUANTS_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/update_portfolio.py

      - name: 完了通知をSlackに送信
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python scripts/notify_slack.py "✅ *ポートフォリオ更新 完了*
          本日 18:00 の株価自動取得が完了しました。
          Notion でご確認ください。
          実行日時: $(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M') JST"

      - name: エラー通知をSlackに送信
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python scripts/notify_slack.py "❌ *ポートフォリオ更新 エラー発生*
          株価の自動取得でエラーが発生しました。
          GitHub Actions のログを確認してください。
          実行日時: $(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M') JST"
